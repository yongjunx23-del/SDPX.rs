name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    runs-on: ubuntu-latest
    env:
      # Every build links BLAS/LAPACK; CI uses the system OpenBLAS.
      RUSTFLAGS: -l dylib=openblas
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Native dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev m4
      - uses: Swatinem/rust-cache@v2
      - name: Workspace tests (system OpenBLAS)
        run: cargo test --locked --release --workspace
      - name: Solver tests (faer)
        run: >
          cargo test --locked --release -p sdpx-solver
          --features faer-sparse
      - name: CLI build
        run: >
          cargo build --locked --release -p sdpx-solver --bin sdpx
          --features faer-sparse

  macos:
    # The development platform: Apple Accelerate BLAS/LAPACK.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Native dependencies
        run: brew install gmp mpfr m4
      - uses: Swatinem/rust-cache@v2
      - name: Solver tests (faer, Accelerate)
        run: >
          cargo test --locked --release -p sdpx-solver
          --features sdp-accelerate,faer-sparse

  build-variants:
    # Compile-only coverage of the opt-in feature sets.
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -l dylib=openblas
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Native dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev m4
      - uses: Swatinem/rust-cache@v2
      - run: >
          cargo check --locked -p sdpx-solver --bin sdpx
          --features faer-sparse,all-precisions

  clippy:
    runs-on: ubuntu-latest
    # Informational until the existing lint backlog is cleared.
    continue-on-error: true
    env:
      RUSTFLAGS: -l dylib=openblas
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
      - name: Native dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev m4
      - uses: Swatinem/rust-cache@v2
      - run: >
          cargo clippy --locked -p sdpx-solver
          --features faer-sparse --lib --bins
