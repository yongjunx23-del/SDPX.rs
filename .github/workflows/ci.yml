name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    runs-on: ubuntu-latest
    env:
      # SDP builds link the system OpenBLAS (it also provides LAPACK).
      RUSTFLAGS: -l dylib=openblas
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Native dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev m4
      - uses: Swatinem/rust-cache@v2
      - name: Workspace tests (default features)
        run: cargo test --locked --release --workspace
      - name: Solver tests (SDP, faer)
        run: >
          cargo test --locked --release -p sdpx-solver
          --features sdp,blas-src,lapack-src,faer-sparse
      - name: CLI build
        run: >
          cargo build --locked --release -p sdpx-solver --bin sdpx
          --features sdp,blas-src,lapack-src,faer-sparse

  clippy:
    runs-on: ubuntu-latest
    # Informational until the existing lint backlog is cleared.
    continue-on-error: true
    env:
      RUSTFLAGS: -l dylib=openblas
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Native dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev m4
      - uses: Swatinem/rust-cache@v2
      - run: >
          cargo clippy --locked -p sdpx-solver
          --features sdp,blas-src,lapack-src,faer-sparse --lib --bins
