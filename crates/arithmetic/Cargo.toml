[package]
name = "sdpx-arithmetic"
version = "0.9.0"
edition = "2021"
license = "Apache-2.0"
description = "Owned fixed-precision MPFR arithmetic for SDPX"

[dependencies]
gmp-mpfr-sys = { version = "=1.6.8", default-features = false, features = ["mpfr"] }
num-traits = "0.2"
serde = { version = "1", optional = true }

[features]
# Opt in to every MPFR frontend precision (128..2048 in steps of 64).
# Without it the executable frontends dispatch six widths (53..1024).
all-precisions = []
