[package]
name = "sdpx-ffi"
version = "0.9.1"
edition = "2021"
license = "Apache-2.0"
[lib]
name = "sdpx"
crate-type = ["cdylib", "rlib"]
[dependencies]
sdpx-solver = { path = "../solver", default-features = false, features = ["serde", "faer-sparse"] }
sdpx-arithmetic = { path = "../arithmetic" }
[features]
# Opt in to every MPFR frontend precision (128..2048 in steps of 64).
all-precisions = ["sdpx-arithmetic/all-precisions"]
sdp-accelerate = ["sdpx-solver/sdp-accelerate"]
sdp-netlib = ["sdpx-solver/sdp-netlib"]
sdp-openblas = ["sdpx-solver/sdp-openblas"]
sdp-mkl = ["sdpx-solver/sdp-mkl"]
faer-sparse = ["sdpx-solver/faer-sparse"]
