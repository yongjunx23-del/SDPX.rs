[package]
name = "sdpx-pmp"
version = "0.9.1"
edition = "2021"
license = "MIT"
description = "MPFR polynomial matrix program converter for SDPX and SDPB"

[dependencies]
sdpx-arithmetic = { path = "../arithmetic" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "=0.37.5"

[features]
# Opt in to every MPFR precision (128..2048 in steps of 64).
all-precisions = ["sdpx-arithmetic/all-precisions"]

[[bin]]
name = "sdpx-pmp2sdp"
path = "src/main.rs"
