[package]
name = "sdpx-pmp"
version = "0.8.0"
edition = "2021"
license = "MIT"
description = "MPFR polynomial matrix program converter for SDPX and SDPB"

[dependencies]
sdpx-arithmetic = { path = "../arithmetic" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "=0.37.5"

[[bin]]
name = "sdpx-pmp2sdp"
path = "src/main.rs"
