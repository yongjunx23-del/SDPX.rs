[package]
name = "sdpx-solver"
version = "0.8.0"
authors = ["Paul Goulart <paul.goulart@eng.ox.ac.uk>"]
edition = "2021"
rust-version = "1.85.0"
license = "Apache-2.0"
description = "SDPX conic solver core adapted from Clarabel.rs"
readme = "README.md"
keywords = ["convex", "optimization", "conic", "solver", "linear-programming"]
categories = ["mathematics"]


[dependencies]
rayon          = "=1.12.0"
amd            = "0.2.2"
cfg-if         = "1.0"
itertools      = "0.11"
derive_builder = "0.11"
enum_dispatch  = "0.3.8"
num-traits     = "0.2"
sdpx-arithmetic = { path = "../arithmetic" }
thiserror      = "1.0"


# -------------------------------
# features
# -------------------------------

[features]
default = ["serde"]

# enable reading / writing of problems from json files 
serde = ["dep:serde", "dep:serde_json", "dep:sha2", "sdpx-arithmetic/serde"]

# enables blas/lapack for SDP support, with blas/lapack src unspecified
# also enable packages required for chordal decomposition 
# `blas-src`/`lapack-src` are provider-neutral shims: pick a provider with a
# `sdp-*` flavour below, or link one directly (e.g. `-l dylib=openblas`).
sdp = ["blas","lapack", "blas-src", "lapack-src", "indexmap", "dep:gemm"]

# explicit configuration options for different blas flavours
sdp-accelerate = ["sdp", "blas-src/accelerate", "lapack-src/accelerate"]
sdp-netlib     = ["sdp", "blas-src/netlib", "lapack-src/netlib", "netlib-src"]
sdp-openblas   = ["sdp", "blas-src/openblas", "lapack-src/openblas", "openblas-src"]
sdp-mkl        = ["sdp", "blas-src/intel-mkl", "lapack-src/intel-mkl","intel-mkl-src"]

# compile with faer supernodal solver option
faer-sparse = ["dep:faer", "dep:faer-traits"]

# compile with more exhaustive benchmarking tests 
bench = []

# opt-in lossless KKT snapshot capture/replay for offline audits (see snapshot.rs)
snapshot = []

# -------------------------------
# SDP configuration
# -------------------------------

[dependencies.blas]
version = "0.22.0"
optional = true

[dependencies.lapack]
version = "0.19.0"
optional = true

[dependencies.blas-src]
version = "0.11.1"
optional = true 

[dependencies.lapack-src]
version = "0.11.0"
optional = true 

[target.'cfg(not(windows))'.dependencies.openblas-src]
version = "0.10.11"
# `cache` shares the built OpenBLAS under ~/.local/share/openblas_build keyed
# by build config: one networked build populates it, offline compute-node
# jobs reuse it. Same source/version, only the location is shared.
features = ["static", "cache"]
optional = true

[target.'cfg(windows)'.dependencies.openblas-src]
version = "0.10.11"
features = ["system"]
optional = true

[dependencies.intel-mkl-src]
version = "0.8.1"
features = ["mkl-static-lp64-iomp"]
optional = true

[dependencies.netlib-src]
version = "0.8.0"
features = ["static"]
optional = true

[dependencies.indexmap]
version = "2.2"
optional = true

# -------------------------------
# 3rd party sparse LDL solvers
# -------------------------------

# Exact per-prime f64 products of the residue kernel: thread-local packing
# (OpenBLAS packs into a shared global buffer pool, which stops scaling
# with many concurrent small calls).
# Worker pinning (Linux sched_setaffinity); already in the lockfile.
[target.'cfg(target_os = "linux")'.dependencies.libc]
version = "0.2.189"

[dependencies.gemm]
version = "0.18.2"
default-features = false
features = ["std"]
optional = true

[dependencies.faer]
version = "0.21.9"
optional = true 

[dependencies.faer-traits]
version = "0.21.5"
optional = true 


# -------------------------------
# examples
# -------------------------------

[[example]]
name = "lp"
path = "examples/rust/example_lp.rs"

[[example]]
name = "qp"
path = "examples/rust/example_qp.rs"

[[example]]
name = "socp"
path = "examples/rust/example_socp.rs"

[[example]]
name = "powcone"
path = "examples/rust/example_powcone.rs"

[[example]]
name = "expcone"
path = "examples/rust/example_expcone.rs"

[[example]]
name = "box"
path = "examples/rust/example_box.rs"

[[example]]
name = "callback"
path = "examples/rust/example_callback.rs"

[[example]]
name = "sdp"
path = "examples/rust/example_sdp.rs"
required-features = ["sdp"]

[[example]]
name = "bootstrap"
path = "examples/rust/example_bootstrap.rs"
required-features = ["sdp"]

[[example]]
name = "box_faer"
path = "examples/rust/example_box_faer.rs"
required-features = ["faer-sparse"]

[[example]]
name = "json"
path = "examples/rust/example_json.rs"
required-features = ["serde"]

[[example]]
name = "kkt_replay"
path = "examples/rust/kkt_replay.rs"
required-features = ["snapshot"]



# -------------------------------
# custom build profiles 
# -------------------------------


# ------------------------------
# JSON input, settings, and CLI receipts
# ------------------------------

[dependencies.serde]
optional = true 
version = "1"
features = ["derive"]

[dependencies.serde_json]
optional = true 
version = "1"
features = ["float_roundtrip"]

[dependencies.sha2]
version = "=0.10.9"
optional = true


# derive_more is used to implement the Debug trait
# used for display python objects.  Increases MSRV
# to 1.75, so not used by default.



[lib]
name = "sdpx_solver"
# A single static library target: the Rust API, examples, and the
# `sdpx-ffi` crate (cdylib) are the only consumers.
crate-type = ["lib"] 

[[bin]]
name = "sdpx"
path = "src/bin/sdpx.rs"
required-features = ["serde"]


# ------------------------------
# enable latex in docs 
# credit: https://github.com/victe/rust-latex-doc-minimal-example
# ------------------------------


# ------------------------------
# testing, benchmarking etc 
# ------------------------------
[dev-dependencies]
tempfile = "3"


