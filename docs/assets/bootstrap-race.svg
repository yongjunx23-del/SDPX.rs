<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="920" height="560" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title>SDPX vs SDPB on the Ising Λ19 bootstrap SDP</title>
<style>
 :root { --bg:#ffffff; --fg:#1f2328; --mute:#656d76; --grid:#d8dee4; --x:#e8590c; --b:#1c7ed6; }
 @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --fg:#e6edf3; --mute:#8d96a0; --grid:#30363d; --x:#ff922b; --b:#4dabf7; } }
 .bg { fill:var(--bg); } .fg { fill:var(--fg); } .mute { fill:var(--mute); }
 .grid { stroke:var(--grid); stroke-width:1; }
 .line { fill:none; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:1; stroke-dashoffset:1; }
 .sx { stroke:var(--x); animation: draw-x 7.0s linear infinite; }
 .sb { stroke:var(--b); animation: draw-b 7.0s linear infinite; }
 @keyframes draw-x { 0% {stroke-dashoffset:1} 40.8% {stroke-dashoffset:0} 100% {stroke-dashoffset:0} }
 @keyframes draw-b { 0% {stroke-dashoffset:1} 80% {stroke-dashoffset:0} 100% {stroke-dashoffset:0} }
 .done-x { opacity:0; animation: show-x 7.0s step-end infinite; }
 .done-b { opacity:0; animation: show-b 7.0s step-end infinite; }
 @keyframes show-x { 0% {opacity:0} 40.8% {opacity:1} }
 @keyframes show-b { 0% {opacity:0} 80% {opacity:1} }
 .bar { transform-box: fill-box; transform-origin: left; animation: grow 7.0s ease-out infinite; }
 @keyframes grow { 0% {transform:scaleX(0)} 25% {transform:scaleX(1)} 100% {transform:scaleX(1)} }
</style>
